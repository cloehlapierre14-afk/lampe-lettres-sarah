<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Les lettres de Sarah — lampe torche</title><style>*{box-sizing:border-box}html,body{margin:0;background:#1b100a;height:100%;font-family:Georgia,serif;color:#f5e6c7}.scene{position:relative;width:100vw;height:100vh;overflow:hidden;touch-action:none;cursor:crosshair;background:#1b100a}.scene img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0;pointer-events:none}.written{mask-image:radial-gradient(circle 115px at var(--x, -300px) var(--y, -300px),black 0%,black 62%,transparent 100%);-webkit-mask-image:radial-gradient(circle 115px at var(--x, -300px) var(--y, -300px),black 0%,black 62%,transparent 100%)}.halo{position:absolute;width:230px;height:230px;left:var(--x,-300px);top:var(--y,-300px);transform:translate(-50%,-50%);border:2px solid #fff4ba55;border-radius:50%;box-shadow:0 0 38px #f6d28a45,inset 0 0 25px #fff6c044;pointer-events:none}.help{position:absolute;left:16px;bottom:14px;background:#1c100bca;border:1px solid #a88b57;padding:9px 13px;border-radius:8px;font-size:clamp(11px,1.7vw,17px);pointer-events:none}.scene:focus-visible{outline:3px solid gold}</style></head><body><main class="scene" id="scene" tabindex="0" aria-label="Déplacez le curseur pour révéler les lettres de Sarah"><img src="lettres_vierges.png" alt="Deux lettres apparemment vierges"><img class="written" src="lettres_ecrites.png" alt="Lettres manuscrites de Sarah révélées par la lampe"><div class="halo"></div><div class="help">🔦 Déplace la lampe sur les lettres pour révéler les mots de Sarah.</div></main><script>const s=document.getElementById('scene');function move(e){const r=s.getBoundingClientRect();s.style.setProperty('--x',(e.clientX-r.left)+'px');s.style.setProperty('--y',(e.clientY-r.top)+'px')}s.addEventListener('pointermove',move);s.addEventListener('pointerdown',e=>{s.setPointerCapture(e.pointerId);move(e)});s.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();let x=parseFloat(s.style.getPropertyValue('--x'))||s.clientWidth/2,y=parseFloat(s.style.getPropertyValue('--y'))||s.clientHeight/2;x+=e.key==='ArrowRight'?35:e.key==='ArrowLeft'?-35:0;y+=e.key==='ArrowDown'?35:e.key==='ArrowUp'?-35:0;s.style.setProperty('--x',Math.max(0,Math.min(s.clientWidth,x))+'px');s.style.setProperty('--y',Math.max(0,Math.min(s.clientHeight,y))+'px')});</script></body></html>
